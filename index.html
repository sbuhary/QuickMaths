<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6c5ce7">
    <meta
      name="description"
      content="MathSprout is a playful mobile whiteboard app for children to practice arithmetic."
    >
    <title>MathSprout</title>
    <link rel="stylesheet" href="styles.css?v=20260829-3">
  </head>
  <body>
    <main class="app-shell">
      <section class="whiteboard" aria-label="Math practice whiteboard">
        <canvas id="board" aria-label="Writable answer whiteboard"></canvas>

        <header class="topbar">
          <div class="brand-mark">
            <p class="eyebrow">MathSprout</p>
            <div class="score-strip">
              <span id="stars">0 stars</span>
              <span id="streak">0 streak</span>
            </div>
          </div>
          <div class="timer" aria-live="polite">
            <span>Time</span>
            <strong id="timer">00:00</strong>
          </div>
        </header>

        <nav class="level-map" aria-label="Level map">
          <button class="level-node active" type="button" data-level="starter">1</button>
          <button class="level-node" type="button" data-level="explorer">2</button>
          <button class="level-node" type="button" data-level="wizard">3</button>
        </nav>

        <button id="settings-toggle" class="circle-button settings-toggle" type="button" aria-label="Practice options" aria-expanded="false">...</button>
        <section id="settings-panel" class="settings-panel" aria-label="Question settings" hidden>
          <label>
            Operation
            <select id="operation">
              <option value="addition">Addition</option>
              <option value="subtraction">Subtraction</option>
              <option value="multiplication">Multiplication</option>
              <option value="division">Division</option>
            </select>
          </label>
          <label>
            Difficulty
            <select id="difficulty">
              <option value="starter">Starter</option>
              <option value="explorer">Explorer</option>
              <option value="wizard">Wizard</option>
            </select>
          </label>
        </section>

        <section class="problem-card" aria-live="polite">
          <div id="question" class="question">Tap Next</div>
        </section>

        <section id="answer-box" class="answer-box" aria-label="Write final answer here">
          <span>Answer</span>
        </section>

        <p id="feedback" class="feedback" aria-live="assertive"></p>

        <section class="tool-dock" aria-label="Whiteboard tools">
          <button class="circle-button color selected" style="--swatch:#1f2937" type="button" data-color="#1f2937" aria-label="Black pen"></button>
          <button class="circle-button color" style="--swatch:#e84393" type="button" data-color="#e84393" aria-label="Pink pen"></button>
          <button class="circle-button color" style="--swatch:#0984e3" type="button" data-color="#0984e3" aria-label="Blue pen"></button>
          <button class="circle-button color" style="--swatch:#00b894" type="button" data-color="#00b894" aria-label="Green pen"></button>
          <button id="eraser" class="circle-button icon-button icon-eraser" type="button" aria-label="Eraser"><span class="sr-only">Eraser</span></button>
          <button id="undo" class="circle-button icon-button icon-undo" type="button" aria-label="Undo"><span class="sr-only">Undo</span></button>
          <button id="clear" class="circle-button icon-button icon-clear" type="button" aria-label="Clear board"><span class="sr-only">Clear</span></button>
          <button id="check" class="action-button primary" type="button">Check</button>
          <button id="next" class="action-button" type="button">Next</button>
        </section>
      </section>
    </main>
    <script src="app.js?v=20260829-3"></script>
  </body>
</html>
