<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="QuickMaths">
    <meta
      name="description"
      content="QuickMaths is a playful mobile whiteboard app for children to practice arithmetic."
    >
    <title>QuickMaths</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/quickmaths-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/quickmaths-icon.svg">
    <link rel="stylesheet" href="styles.css?v=20260830-03">
  </head>
  <body>
    <main class="app-shell">
      <section id="start-screen" class="start-screen" aria-label="Choose practice level">
        <div class="start-card">
          <p class="eyebrow">QuickMaths</p>
          <h1>Pick a math path</h1>
          <label>
            Operation
            <select id="operation">
              <option value="stage">Stage plan</option>
              <option value="addition">Addition</option>
              <option value="subtraction">Subtraction</option>
              <option value="multiplication">Multiplication</option>
              <option value="division">Division</option>
            </select>
          </label>
          <select id="difficulty" class="sr-only" aria-label="Difficulty">
            <option value="starter">Starter</option>
            <option value="explorer">Explorer</option>
            <option value="builder">Builder</option>
            <option value="wizard">Wizard</option>
          </select>
          <p id="stage-summary" class="stage-summary">Stage 1: Tiny sums</p>
          <p id="session-summary" class="session-summary">0 right / 0 missed</p>
          <p id="session-detail" class="session-detail">0:00 practiced / 0 stars earned</p>
          <div class="level-path" aria-label="Candy path levels">
            <button class="level-node active" type="button" data-stage="1" data-level="starter"><span>1</span><small>Starter</small></button>
            <button class="level-node" type="button" data-stage="2" data-level="starter"><span>2</span><small>Starter</small></button>
            <button class="level-node" type="button" data-stage="3" data-level="starter"><span>3</span><small>Starter</small></button>
            <button class="level-node" type="button" data-stage="4" data-level="starter"><span>4</span><small>Starter</small></button>
            <button class="level-node" type="button" data-stage="5" data-level="explorer"><span>5</span><small>Explorer</small></button>
            <button class="level-node" type="button" data-stage="6" data-level="explorer"><span>6</span><small>Explorer</small></button>
            <button class="level-node" type="button" data-stage="7" data-level="explorer"><span>7</span><small>Explorer</small></button>
            <button class="level-node" type="button" data-stage="8" data-level="explorer"><span>8</span><small>Explorer</small></button>
            <button class="level-node" type="button" data-stage="9" data-level="builder"><span>9</span><small>Builder</small></button>
            <button class="level-node" type="button" data-stage="10" data-level="builder"><span>10</span><small>Builder</small></button>
            <button class="level-node" type="button" data-stage="11" data-level="wizard"><span>11</span><small>Wizard</small></button>
            <button class="level-node" type="button" data-stage="12" data-level="wizard"><span>12</span><small>Wizard</small></button>
          </div>
        </div>
        <div class="start-overlay">
          <button id="start-practice" class="action-button primary wide" type="button">Start stage 1</button>
          <button id="retry-missed" class="circle-button reset-button" type="button" aria-label="Retry missed questions" disabled><i data-lucide="repeat-2"></i></button>
          <button id="reset-progress" class="circle-button reset-button" type="button" aria-label="Reset progress"><i data-lucide="rotate-ccw"></i></button>
        </div>
      </section>

      <section id="practice-board" class="whiteboard" aria-label="Math practice whiteboard" hidden>
        <canvas id="board" aria-label="Writable answer whiteboard"></canvas>

        <header class="topbar">
          <button id="back-to-levels" class="circle-button back-button" type="button" aria-label="Back to levels"><i data-lucide="chevron-left"></i></button>
          <div class="brand-mark">
            <p class="eyebrow">QuickMaths</p>
            <div class="score-strip">
              <span id="stars">0 stars</span>
              <span id="streak">0 streak</span>
            </div>
          </div>
          <button id="sound-toggle" class="circle-button sound-button" type="button" aria-label="Mute sounds"><i data-lucide="volume-2"></i></button>
          <button id="timer-control" class="timer digital" type="button" aria-label="Change timer style">
            <span>Time</span>
            <strong id="timer">01:00</strong>
            <i class="timer-art" aria-hidden="true"></i>
          </button>
        </header>

        <section class="board-toolbar" aria-label="Whiteboard tools">
          <button id="pencil" class="circle-button tool-button selected-tool" type="button" aria-label="Pencil and colors"><i data-lucide="pencil"></i></button>
          <button id="eraser" class="circle-button tool-button" type="button" aria-label="Eraser"><i data-lucide="eraser"></i></button>
          <button id="undo" class="circle-button tool-button" type="button" aria-label="Undo"><i data-lucide="undo-2"></i></button>
          <button id="clear-answer" class="circle-button tool-button" type="button" aria-label="Clear answer"><i data-lucide="badge-x"></i></button>
          <button id="clear" class="circle-button tool-button danger-tool" type="button" aria-label="Clear whole board"><i data-lucide="trash-2"></i></button>
          <button id="hand-toggle" class="circle-button tool-button" type="button" aria-label="Move controls to left or right"><i data-lucide="panel-left"></i></button>
        </section>

        <section id="pen-panel" class="pen-panel" aria-label="Pen options" hidden>
          <div class="palette" aria-label="Pen colors">
            <button class="circle-button color selected" style="--swatch:#1f2937" type="button" data-color="#1f2937" aria-label="Black pen"></button>
            <button class="circle-button color" style="--swatch:#e84393" type="button" data-color="#e84393" aria-label="Pink pen"></button>
            <button class="circle-button color" style="--swatch:#0984e3" type="button" data-color="#0984e3" aria-label="Blue pen"></button>
            <button class="circle-button color" style="--swatch:#00b894" type="button" data-color="#00b894" aria-label="Green pen"></button>
          </div>
          <div class="pen-sizes" aria-label="Pen thickness">
            <button class="circle-button size selected-size" style="--dot:8px" type="button" data-size="5" aria-label="Thin pen"></button>
            <button class="circle-button size" style="--dot:12px" type="button" data-size="8" aria-label="Medium pen"></button>
            <button class="circle-button size" style="--dot:16px" type="button" data-size="11" aria-label="Thick pen"></button>
          </div>
        </section>


        <section class="problem-card" aria-live="polite">
          <div id="question" class="question">Tap Start</div>
        </section>

        <section id="answer-box" class="answer-box" aria-label="Write final answer here">
          <span>Answer</span>
        </section>

        <section id="feedback-panel" class="feedback-panel" hidden>
          <div class="result-mark" id="result-mark" aria-hidden="true"><i data-lucide="sparkles"></i></div>
          <p id="feedback" class="feedback" aria-live="assertive"></p>
          <div class="feedback-actions">
            <button id="retry-feedback" class="action-button" type="button">Try again</button>
            <button id="next-feedback" class="action-button primary" type="button">Next</button>
            <button id="close-feedback" class="action-button" type="button">OK</button>
            <button id="mark-correct" class="action-button primary" type="button">Correct</button>
            <button id="mark-wrong" class="action-button" type="button">Wrong</button>
          </div>
        </section>


        <section class="action-stack" aria-label="Question actions">
          <button id="check" class="action-button primary" type="button">Check</button>
          <button id="next-main" class="action-button" type="button">Next</button>
        </section>
      </section>
    </main>

    <script src="version.js"></script>
    <script src="icons.js?v=20260830-03"></script>
    <script src="app.js?v=20260830-03"></script>
  </body>
</html>
