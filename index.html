<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6c5ce7">
    <meta
      name="description"
      content="MathSprout is a playful mobile whiteboard app for children to practice arithmetic."
    >
    <title>MathSprout</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MathSprout</p>
          <h1>Grow your math powers</h1>
        </div>
        <div class="timer" aria-live="polite">
          <span>Time</span>
          <strong id="timer">00:00</strong>
        </div>
      </header>

      <section class="level-map" aria-label="Level map">
        <button class="level-node active" type="button" data-level="starter">1</button>
        <button class="level-node" type="button" data-level="explorer">2</button>
        <button class="level-node" type="button" data-level="wizard">3</button>
      </section>

      <section class="controls" aria-label="Question settings">
        <label>
          Operation
          <select id="operation">
            <option value="addition">Addition</option>
            <option value="subtraction">Subtraction</option>
            <option value="multiplication">Multiplication</option>
            <option value="division">Division</option>
          </select>
        </label>
        <label>
          Difficulty
          <select id="difficulty">
            <option value="starter">Starter</option>
            <option value="explorer">Explorer</option>
            <option value="wizard">Wizard</option>
          </select>
        </label>
      </section>

      <section class="question-panel" aria-live="polite">
        <div class="score-strip">
          <span id="stars">0 stars</span>
          <span id="streak">0 streak</span>
        </div>
        <div id="question" class="question">Tap Next to begin</div>
      </section>

      <section class="board-panel">
        <div class="toolbar" aria-label="Whiteboard tools">
          <button class="color selected" style="--swatch:#1f2937" type="button" data-color="#1f2937" aria-label="Black pen"></button>
          <button class="color" style="--swatch:#e84393" type="button" data-color="#e84393" aria-label="Pink pen"></button>
          <button class="color" style="--swatch:#0984e3" type="button" data-color="#0984e3" aria-label="Blue pen"></button>
          <button class="color" style="--swatch:#00b894" type="button" data-color="#00b894" aria-label="Green pen"></button>
          <button id="eraser" type="button">Eraser</button>
          <button id="undo" type="button">Undo</button>
          <button id="clear" type="button">Clear</button>
        </div>
        <canvas id="board" aria-label="Writable answer whiteboard"></canvas>
      </section>

      <section class="answer-panel">
        <label>
          Recognized answer
          <input id="answer" inputmode="numeric" autocomplete="off" placeholder="Write or type answer">
        </label>
        <div class="action-row">
          <button id="check" class="primary" type="button">Check</button>
          <button id="next" type="button">Next</button>
        </div>
        <p id="feedback" class="feedback" aria-live="assertive"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
